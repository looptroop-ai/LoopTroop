# Finishes Renovate's Node floor pull requests.
#
# Renovate raises `engines.node` once a Node release is 90 days old — the
# "node floor" rule in .github/renovate.json. That edits one line, but the floor
# is also stated in the lockfile's root entry, the launcher guard, both install
# scripts, a Chocolatey test fixture and README, each held to it by a test. So
# the pull request arrives red, and the hosted Renovate app cannot run
# postUpgradeTasks to fix it.
#
# `regenerate` writes the floor into every copy, and `push` commits the result
# back, so the pull request is complete on arrival. They split for the reason
# renovate-notices.yml gives: `regenerate` runs code from the branch and has no
# write credential; `push` has the credential and runs no code from the branch,
# and applies a patch only once it is sure the patch changes nothing but numbers
# in the files the floor lives in.
#
# Whether the new floor may merge at all is decided elsewhere: the required
# Verify job in ci.yml refuses any pull request that changes `engines.node`
# until winget, Chocolatey, Scoop and Homebrew all offer the new floor (#135 was
# a floor winget did not have yet). That covers a floor moved by hand as well,
# and a required check is the only kind that can stop a merge.
#
# Nothing merges the pull request but a person, after review, so it should be
# green by the time they look. That needs one more thing: when a feed catches
# up, nothing about the pull request changes, so nothing would run Verify again.
# `recheck` does, every day, until the pull request is green or gone.
#
# Nothing here installs dependencies. Both scripts use Node built-ins only, so
# no dependency's install script runs in these jobs either.
#
# The CI lanes that test the floor read it from `engines.node` at run time, so a
# floor change never edits a workflow — which `push` could not commit anyway.
name: Renovate node floor

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # For `recheck`: after Renovate's own run, which .github/renovate.json
  # schedules for 00:00-05:59 in Bucharest.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-node-floor-${{ github.head_ref || github.event_name }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Write the Node floor into every copy
    # Renovate's floor pull request, and nothing else. The author is trusted
    # event metadata; the branch name is not, so both are required.
    if: >-
      github.head_ref == 'renovate/node-floor'
      && (github.event.pull_request.user.login == 'renovate[bot]'
          || github.event.pull_request.user.login == 'renovate-bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      # No token, and no credentials left in `.git/config`. The head SHA rather
      # than the branch name, so the patch describes the tree it was built from.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Write the floor into every copy
        run: node scripts/sync-node-floor.ts

      - name: Did anything change?
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Every copy already states the floor; nothing to push."
          else
            git diff > "${RUNNER_TEMP}/node-floor.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-floor-patch
          path: ${{ runner.temp }}/node-floor.patch
          if-no-files-found: error
          retention-days: 1

  push:
    name: Commit the Node floor
    needs: [regenerate]
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: node-floor-patch
          path: ${{ runner.temp }}/node-floor-artifact

      # The patch came from code on the branch, so it is checked before git sees
      # it as anything but text: exactly one regular file; an edit to files the
      # floor lives in and nothing else — no new, deleted or renamed file, no
      # mode change (a symlink is a mode), no binary content; and a change to
      # the floor and nothing else. Every changed line must match its
      # replacement once the old and new floor are written out of both: the
      # version itself, the Homebrew keg's major, and the launcher's three
      # constants. Masking every number would not do — `exit 1` to `exit 0` in
      # `install.sh`, or a lockfile integrity hash, changes digits alone — so
      # any other edit is refused however it is dressed. Changed lines are read
      # from inside the hunks, where git reads them, so a line made to look like
      # a `+++` header cannot hide from the comparison.
      - name: Validate and apply the patch
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/node-floor-artifact"
          mapfile -t entries < <(find "${artifact_dir}" -mindepth 1 -print)
          patch="${artifact_dir}/node-floor.patch"
          if [ "${#entries[@]}" -ne 1 ] || [ "${entries[0]}" != "${patch}" ] || [ ! -f "${patch}" ] || [ -L "${patch}" ]; then
            echo "::error::The artifact must be exactly one regular file, node-floor.patch."
            exit 1
          fi
          if [ -n "$(git apply --summary -- "${patch}")" ]; then
            echo "::error::The patch creates, deletes, renames or changes the mode of a file."
            exit 1
          fi
          # The floor before and after, read as data with jq: nothing from the
          # branch runs here. Before is the pull request's base.
          floor_of() {
            if [[ "$1" =~ ^[[:space:]]*(\>=[[:space:]]*)?v?(([0-9]+)\.([0-9]+)\.([0-9]+))[[:space:]]*$ ]]; then
              printf '%s %s %s %s\n' "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}" "${BASH_REMATCH[4]}" "${BASH_REMATCH[5]}"
            else
              echo "::error::engines.node is not an exact floor: $1" >&2
              exit 1
            fi
          }
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          read -r old_floor old_major old_minor old_patch < <(floor_of "$(git show FETCH_HEAD:package.json | jq -r .engines.node)")
          read -r new_floor new_major new_minor new_patch < <(floor_of "$(jq -r .engines.node package.json)")
          removed_lines="${RUNNER_TEMP}/node-floor-removed"
          added_lines="${RUNNER_TEMP}/node-floor-added"
          : > "${removed_lines}"
          : > "${added_lines}"
          awk -v removed="${removed_lines}" -v added="${added_lines}" \
            -v old_floor="${old_floor}" -v new_floor="${new_floor}" \
            -v old_keg="node@${old_major}" -v new_keg="node@${new_major}" \
            -v old_major="${old_major}" -v new_major="${new_major}" \
            -v old_minor="${old_minor}" -v new_minor="${new_minor}" \
            -v old_patch="${old_patch}" -v new_patch="${new_patch}" '
            function swap(text, word, replacement,    at, out) {
              out = ""
              while ((at = index(text, word)) > 0) {
                out = out substr(text, 1, at - 1) replacement
                text = substr(text, at + length(word))
              }
              return out text
            }
            # The launcher states the floor as three numbers, and its lines are
            # judged as they stand, before anything is masked: each may be the
            # matching component of the old or new floor and nothing else.
            # Masking any number here would let REQUIRED_MAJOR = 0 switch off
            # the version guard, and masking the version first would let
            # REQUIRED_MAJOR = 24.18.1 through as a launcher that cannot parse.
            #
            # Everywhere else the floor is written out only where a floor move
            # writes it: the five phrases below and the Homebrew keg. A version
            # that happens to equal the floor anywhere else, a dependency in the
            # lockfile say, is left as it is, so changing it is refused.
            function floorless(text,    i, part, value) {
              if (text ~ /^var REQUIRED_/) {
                if (text ~ /^var REQUIRED_(MAJOR|MINOR|PATCH) = [0-9]+$/) {
                  part = substr(text, 14, 5)
                  value = text
                  sub(/^.* = /, "", value)
                  if ((part == "MAJOR" && (value == old_major || value == new_major)) ||
                      (part == "MINOR" && (value == old_minor || value == new_minor)) ||
                      (part == "PATCH" && (value == old_patch || value == new_patch)))
                    sub(/= [0-9]+$/, "= <floor>", text)
                }
                return text
              }
              for (i = 1; i <= phrases; i++) {
                text = swap(text, sprintf(phrase[i], old_floor), sprintf(phrase[i], "<floor>"))
                text = swap(text, sprintf(phrase[i], new_floor), sprintf(phrase[i], "<floor>"))
              }
              text = swap(text, "`" old_keg "`", "`<keg>`")
              return swap(text, "`" new_keg "`", "`<keg>`")
            }
            BEGIN { phrases = split("\">=%s\"|version=\"%s\"|Node %s or newer|Node `%s+`|Node.js %s or newer", phrase, "|") }
            /^diff --git / { hunk = 0; next }
            /^@@ / { hunk = 1; next }
            !hunk { next }
            /^-/ { print floorless(substr($0, 2)) > removed; next }
            /^\+/ { print floorless(substr($0, 2)) > added; next }
          ' "${patch}"
          if ! cmp -s -- "${removed_lines}" "${added_lines}"; then
            echo "::error::The patch changes more than the Node floor (${old_floor} to ${new_floor})."
            exit 1
          fi
          allowed=' package-lock.json README.md scripts/install.ps1 scripts/install.sh server/cli/launcher.cjs tests/fixtures/channels/looptroop.nuspec '
          while IFS=$'\t' read -r lines_added lines_removed path; do
            if [ "${lines_added}" = '-' ] || [ "${lines_removed}" = '-' ]; then
              echo "::error::The patch changes ${path} as binary."
              exit 1
            fi
            case "${allowed}" in
              *" ${path} "*) ;;
              *) echo "::error::The patch edits ${path}, which is not a copy of the Node floor."; exit 1 ;;
            esac
          done < <(git apply --numstat -- "${patch}")
          git apply -- "${patch}"

      # No token in this step: checkout, diff and commit cannot read one even
      # if a runner has a global hook configured.
      - name: Commit the Node floor
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json README.md scripts/install.ps1 scripts/install.sh server/cli/launcher.cjs tests/fixtures/channels/looptroop.nuspec
          git -c core.hooksPath=/dev/null commit -m "chore(deps): write the new Node floor into every copy"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # RELEASE_PR_TOKEN rather than GITHUB_TOKEN, because a push made with
      # GITHUB_TOKEN starts no workflow runs and the required checks would never
      # re-run. As in renovate-notices.yml: the branch must still be where the
      # patch came from, the push is not forced, and the token exists only as an
      # extraHeader for these two git invocations.
      - name: Push the Node floor
        if: steps.commit.outputs.committed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set. Add it as a repository secret."
            exit 1
          fi
          credential=$(printf 'x-access-token:%s' "${RELEASE_TOKEN}" | base64 | tr -d '\n')
          unset RELEASE_TOKEN
          remote=$(GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraHeader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${credential}" \
            git -c core.hooksPath=/dev/null ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)
          if [ "${remote}" != "${SOURCE_SHA}" ]; then
            echo "::notice::${HEAD_REF} has moved to ${remote:-(gone)} since ${SOURCE_SHA} was built."
            echo "::notice::Leaving it alone; the run for that commit will write the floor."
            exit 0
          fi

          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraHeader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${credential}" \
            git -c core.hooksPath=/dev/null push origin "HEAD:${HEAD_REF}"

  # Re-runs whatever failed on the open floor pull request's head, in any
  # workflow: Verify while a feed was late, and a flaky lane just the same,
  # since either one keeps the pull request red. A check that fails for a real
  # reason fails again, and the pull request stays open; nothing merges red.
  #
  # GitHub re-runs a run only within 30 days of its start, and a feed can stay
  # behind longer than that. Once a re-run is refused, this ticks the rebase box
  # in Renovate's own pull request text instead: Renovate rebuilds the branch,
  # and every workflow starts a fresh run on the new head.
  #
  # No checkout and no secret: it reads run results, asks for re-runs, and
  # edits nothing but that one checkbox.
  recheck:
    name: Re-run what failed on the floor pull request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Re-run the failed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list --head renovate/node-floor --state open \
            --json number,headRefOid,isCrossRepository,author \
            --jq '[.[] | select((.isCrossRepository | not) and (.author.login == "app/renovate" or .author.login == "renovate[bot]"))][0] // empty | "\(.number) \(.headRefOid)"')
          if [ -z "${pr}" ]; then
            echo "No open Node floor pull request."
            exit 0
          fi
          read -r number head <<< "${pr}"
          failed=$(gh run list --commit "${head}" --limit 100 --json databaseId,status,conclusion \
            --jq '.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out")) | .databaseId')
          if [ -z "${failed}" ]; then
            echo "Nothing has failed on ${head}."
            exit 0
          fi
          refused=false
          for run in ${failed}; do
            echo "Re-running the failed jobs of run ${run} on ${head}."
            gh run rerun "${run}" --failed || refused=true
          done
          if [ "${refused}" = false ]; then
            exit 0
          fi
          body=$(gh api "repos/${GH_REPO}/pulls/${number}" --jq .body)
          unticked='- [ ] <!-- rebase-check -->'
          ticked='- [x] <!-- rebase-check -->'
          if [[ "${body}" == *"${ticked}"* ]]; then
            echo "Renovate has already been asked to rebase #${number}."
          elif [[ "${body}" == *"${unticked}"* ]]; then
            # The replacement stays unquoted: bash 3.2, macOS's, keeps quotes
            # there as literal text, and it contains no `&` for bash 5.2 to expand.
            gh api --method PATCH "repos/${GH_REPO}/pulls/${number}" -f "body=${body/"${unticked}"/${ticked}}" > /dev/null
            echo "::notice::A run on #${number} could not be re-run, so Renovate has been asked to rebase it."
          else
            echo "::error::A run on #${number} could not be re-run, and its text has no rebase box to tick."
            exit 1
          fi
