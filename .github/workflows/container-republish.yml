# Rebuild and republish the container image for a version that is already
# released.
#
# The container channel is the repairable one. `release.yml` runs it in parallel
# with npm and behind nothing, precisely so a broken image cannot strand a
# published package — and this is the other half of that bargain: the way the
# image gets published afterwards, without re-running a release.
#
# It exists because `scripts/release-detect.ts` cannot help here. The resolver
# knows `fresh`, `resume-npm` and `resume-github`, and nothing about either
# registry, so once npm and the tag are done a re-run of `release.yml` resolves
# to `complete` and skips the container jobs entirely. There is no state for it
# to resume into.
#
# Nothing here is rebuilt from source. The image is built from the tarball
# attached to the GitHub Release — the same bytes npm published, verified
# against the same manifest — because a rebuild from a checkout could differ
# from what was released and nobody would find out.
#
# Release assets are used rather than workflow artefacts on purpose: artefacts
# expire, assets do not, which is what lets this run months after the release it
# repairs.
#
# A rebuild does not reproduce the released digests, and is not expected to. The
# base image moves, and so do the Debian and GitHub CLI package repositories the
# image installs from, so the same commit built a week later is a different
# image. That is why the tagging step decides what to publish by reading the
# labels on whatever is already on the version tag rather than by comparing
# digests: where an earlier publish of this release exists, its bytes are the
# released ones and this run's build is discarded, with the registries that are
# missing the tag filled from the one that has it. Only when no registry has the
# version at all does the freshly built image become the release.
name: Republish container image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'A released version, without the leading v, as MAJOR.MINOR.PATCH'
        required: true
        type: string

permissions:
  contents: read

env:
  DH_IMAGE: docker.io/looptroopai/looptroop
  GHCR_IMAGE: ghcr.io/looptroop-ai/looptroop
  NPM_CONFIG_FETCH_RETRIES: '3'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'

# The same group `release.yml` uses, so a repair cannot race a release. Never
# cancelled: this publishes to registries, and being interrupted between the two
# is the state it exists to fix.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Which bytes are we republishing, and are they really that release's?
  # ---------------------------------------------------------------------------
  prepare:
    name: Fetch and verify the released artefact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      floating: ${{ steps.floating.outputs.floating }}
      tarball: ${{ steps.resolve.outputs.tarball }}
      lockfile: ${{ steps.resolve.outputs.lockfile }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      # A dispatch input is free text, and it is about to be interpolated into
      # image references and a git ref. Checked before it is used for anything.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a version. Write it as MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.N — no leading v."
            exit 1
          fi
          echo "Repairing the container image for v${VERSION}."

      # At the tag, not at the dispatch ref and not at current main. The scripts
      # and Dockerfile that built the released image are the ones at that tag,
      # and main has moved on by definition — if it had not, there would be no
      # repair to make.
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Pin npm
        run: node scripts/pin-npm.mjs

      - name: Download the released artefact
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${ASSET_DIR}"
          gh release download "v${VERSION}" \
            --dir "${ASSET_DIR}" \
            --pattern "looptroop-${VERSION}.tgz" \
            --pattern release-manifest.json
          ls -l "${ASSET_DIR}/looptroop-${VERSION}.tgz" "${ASSET_DIR}/release-manifest.json"

      # Three separate questions, none of which the integrity check answers.
      #
      # `release:verify-artifact` compares size and both hashes, so it proves the
      # tarball matches *its* manifest — not that the manifest belongs to this
      # version, and not that either belongs to the tag being built from. A
      # manifest that agrees with its tarball perfectly while naming another
      # version would otherwise publish those bytes under this version's tags.
      - name: The artefact is the one this tag released
        id: resolve
        env:
          ASSET_DIR: ${{ runner.temp }}/release-assets
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse "refs/tags/v${VERSION}^{commit}")

          # Through the environment rather than argv, so nothing has to be
          # quoted into a program.
          # Embedded JavaScript is single-quoted so the shell cannot expand its template literals.
          # shellcheck disable=SC2016
          TAG_COMMIT="${tag_commit}" node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync(`${process.env.ASSET_DIR}/release-manifest.json`, "utf8"))
            const version = process.env.VERSION
            const problems = []
            if (manifest.version !== version) {
              problems.push(`the manifest is for ${manifest.version}, not ${version}`)
            }
            if (manifest.tarball !== `looptroop-${version}.tgz`) {
              problems.push(`the manifest names ${manifest.tarball}`)
            }
            if (manifest.commit !== process.env.TAG_COMMIT) {
              problems.push(`the manifest was built at ${manifest.commit || "(unknown)"}, the tag is at ${process.env.TAG_COMMIT}`)
            }
            if (problems.length > 0) {
              console.error(`::error::The release assets do not belong to v${version}: ${problems.join("; ")}.`)
              process.exit(1)
            }
          '
          npm run release:verify-artifact -- \
            "${ASSET_DIR}/looptroop-${VERSION}.tgz" \
            "${ASSET_DIR}/release-manifest.json"

          # Older manifests predate package-lock.json as a release asset. Keep
          # those repairs on their tag's tarball-only Dockerfile path.
          # Embedded JavaScript is single-quoted so the shell cannot expand its template literals.
          # shellcheck disable=SC2016
          lockfile_expected=$(node -e '
            const fs = require("node:fs")
            const manifest = JSON.parse(fs.readFileSync(`${process.env.ASSET_DIR}/release-manifest.json`, "utf8"))
            process.stdout.write(manifest.assets?.["package-lock.json"] ? "yes" : "no")
          ')
          if [ "${lockfile_expected}" = yes ]; then
            gh release download "v${VERSION}" --dir "${ASSET_DIR}" --pattern package-lock.json
            # The container only needs the tarball and its matching lockfile.
            # This focused check avoids pretending the other release assets are
            # present while retaining strict digest verification when recorded.
            # Embedded JavaScript is single-quoted so the shell cannot expand its template literals.
            # shellcheck disable=SC2016
            ASSET_DIR="${ASSET_DIR}" node -e '
              const fs = require("node:fs")
              const crypto = require("node:crypto")
              const manifest = JSON.parse(fs.readFileSync(`${process.env.ASSET_DIR}/release-manifest.json`, "utf8"))
              const expected = manifest.assets?.["package-lock.json"]
              if (!expected) throw new Error("release manifest changed while downloading package-lock.json")
              const bytes = fs.readFileSync(`${process.env.ASSET_DIR}/package-lock.json`)
              const sha256 = crypto.createHash("sha256").update(bytes).digest("hex")
              if (bytes.length !== expected.bytes || sha256 !== expected.sha256) {
                throw new Error(`package-lock.json does not match the release manifest (${sha256})`)
              }
              console.log(`package-lock.json matches ${sha256}`)
            '
            echo "lockfile=release-assets/package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo 'Legacy release manifest: no package-lock.json asset; using its tarball-only container path.'
            echo 'lockfile=' >> "$GITHUB_OUTPUT"
          fi

          # From the same function the release resolver uses, rather than a
          # second reading of the suffix here — the dist-tag is what decides
          # whether this publish may take `latest`. It is also the narrower
          # check: it accepts `-rc.N` and nothing else, so a prerelease spelling
          # no channel knows how to route is refused here rather than published
          # under a tag chosen by accident.
          # Embedded JavaScript is single-quoted so the shell cannot expand its template literals.
          # shellcheck disable=SC2016
          dist_tag=$(node -e '
            import("./scripts/version-bump.ts")
              .then((m) => process.stdout.write(m.distTagFor(process.env.VERSION)))
              .catch((error) => {
                console.error(`::error::${error.message}`)
                process.exit(1)
              })
          ')

          {
            echo "version=${VERSION}"
            echo "dist_tag=${dist_tag}"
            echo "tarball=release-assets/looptroop-${VERSION}.tgz"
            echo "commit=${tag_commit}"
          } >> "$GITHUB_OUTPUT"
          echo "v${VERSION} at ${tag_commit}, dist-tag ${dist_tag}."

      # Which floating tags this repair is allowed to move, which is usually
      # none of them.
      #
      # A release publishes the newest thing there is, so every floating tag it
      # writes is one it should own. A repair does not: it republishes a version
      # that may be many releases behind, and writing `latest` and the series
      # along with it would make `docker pull looptroopai/looptroop` serve an old
      # version again — silently, as the successful outcome of a repair.
      #
      # npm decides, because it is the channel with a publish job that has an
      # opinion: a container floating tag moves only where npm's dist-tags
      # already say the package tag points at this version. The `X.Y` series has
      # no npm equivalent, so it is decided by ordering — no later stable release
      # in the series. Everything unproven is simply left out, which turns it
      # from a tag the repair writes into one it must prove it did not touch.
      #
      # If npm cannot be read at all, nothing floating is claimed. A repair that
      # fixes only the version tag is a repair; one that guesses at `latest` is a
      # regression nobody asked for.
      - name: Which floating tags this repair may move
        id: floating
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if ! npm view looptroop --json > npm-view.json 2>npm-view-err.txt; then
            echo "::warning::Could not read npm; repairing the version tag only."
            cat npm-view-err.txt
            echo "floating=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          floating=$(node -e '
            const fs = require("node:fs")
            const view = JSON.parse(fs.readFileSync("npm-view.json", "utf8"))
            const version = process.env.VERSION
            const series = version.split(".").slice(0, 2).join(".")
            import("./scripts/container-tags.ts").then((m) => {
              const tags = m.authoritativeFloating(
                version,
                series,
                view["dist-tags"] ?? {},
                Array.isArray(view.versions) ? view.versions : [],
              )
              process.stdout.write(tags.join(" "))
            })
          ')
          echo "floating=${floating}" >> "$GITHUB_OUTPUT"
          echo "Floating tags this repair owns: ${floating:-(none; version tag only)}"

      # Handed to the build legs the same way release.yml hands them over, so
      # both workflows feed the container build from an identically named
      # artefact.
      - name: Upload the artefact for the build legs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artefacts
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # From here down this is release.yml's container channel, driven by the same
  # scripts. The steps differ only in where the version comes from.
  # ---------------------------------------------------------------------------
  build:
    name: Build container image (${{ matrix.arch }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Pin npm
        run: node scripts/pin-npm.mjs

      - name: Download the release artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artefacts
          path: release-assets

      # Again, on this machine. The artefact travelled between jobs to get here.
      - name: Verify the artefact matches the manifest
        env:
          LOCKFILE: ${{ needs.prepare.outputs.lockfile }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm run release:verify-artifact -- \
            "release-assets/looptroop-${VERSION}.tgz" \
            release-assets/release-manifest.json
          if [ -n "${LOCKFILE}" ]; then
            test -f "${LOCKFILE}"
            # Embedded JavaScript is single-quoted so the shell cannot expand its template literals.
            # shellcheck disable=SC2016
            LOCKFILE="${LOCKFILE}" node -e '
              const fs = require("node:fs")
              const crypto = require("node:crypto")
              const manifest = JSON.parse(fs.readFileSync("release-assets/release-manifest.json", "utf8"))
              const expected = manifest.assets?.["package-lock.json"]
              const bytes = fs.readFileSync(process.env.LOCKFILE)
              const sha256 = crypto.createHash("sha256").update(bytes).digest("hex")
              if (!expected || bytes.length !== expected.bytes || sha256 !== expected.sha256) {
                throw new Error(`package-lock.json does not match the release manifest (${sha256})`)
              }
              console.log(`package-lock.json matches ${sha256}`)
            '
          else
            echo 'Legacy release: no lockfile asset to verify.'
          fi

      - name: Log in to Docker Hub and GHCR
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::The 'release' environment must carry DOCKERHUB_USERNAME (variable) and DOCKERHUB_TOKEN (secret)."
            exit 1
          fi
          printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io \
            --username "${DOCKERHUB_USERNAME}" --password-stdin
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      # Cached, for the reason spelled out in release.yml: an uncached setup
      # makes every run depend on a fresh CDN download, which is exactly how the
      # arm64 leg of the first release was lost.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.1

      # `--provenance=false` and `push-by-digest=true` for the same reasons as in
      # release.yml: provenance would wrap a single-platform build in an index
      # that `imagetools create` cannot join, and an untagged manifest keeps a
      # half-finished repair from publishing a single-architecture image.
      #
      # REVISION is the released commit, which is the tag this ran from — not
      # GITHUB_SHA, which for a dispatch is whatever branch the button was
      # pressed on.
      - name: Build the image and push it by digest
        env:
          TARBALL: ${{ needs.prepare.outputs.tarball }}
          LOCKFILE: ${{ needs.prepare.outputs.lockfile }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.commit }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ -f scripts/Dockerfile ]; then
            dockerfile=scripts/Dockerfile
          else
            dockerfile=Dockerfile
          fi
          if ! test -f "${dockerfile}"; then
            echo "::error::No Dockerfile at scripts/Dockerfile or Dockerfile in the released tag."
            exit 1
          fi
          test -f "${TARBALL}"
          context_files=("${dockerfile}" "${TARBALL}")
          build_args=(--build-arg "TARBALL=${TARBALL}")
          if [ -n "${LOCKFILE}" ]; then
            test -f "${LOCKFILE}"
            context_files+=("${LOCKFILE}")
            build_args+=(--build-arg "LOCKFILE=${LOCKFILE}")
          fi
          tar -cf - "${context_files[@]}" | docker buildx build -f "${dockerfile}" \
            --platform "${PLATFORM}" \
            "${build_args[@]}" \
            --build-arg VERSION="${VERSION}" \
            --build-arg REVISION="${REVISION}" \
            --provenance=false \
            --output "type=image,name=${DH_IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --output "type=image,name=${GHCR_IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/meta.json \
            -

      - name: Record the digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          digest=$(
            # Embedded JavaScript is single-quoted so the shell cannot expand its template literals.
            # shellcheck disable=SC2016
            node -e '
            const meta = JSON.parse(require("node:fs").readFileSync("/tmp/meta.json", "utf8"))
            const found = new Set()
            const walk = (node) => {
              if (!node || typeof node !== "object") return
              const value = node["containerimage.digest"]
              if (typeof value === "string") found.add(value)
              for (const child of Object.values(node)) walk(child)
            }
            walk(meta)
            const digests = [...found]
            const usable = digests.length === 1 && /^sha256:[0-9a-f]{64}$/.test(digests[0])
            if (!usable) {
              console.error(`::error::buildx reported ${digests.length} image digests, expected exactly one.`)
              console.error(JSON.stringify(meta, null, 2))
              process.exit(1)
            }
            process.stdout.write(digests[0])
            '
          )
          printf '%s\n' "${digest}" > "digest-${ARCH}.txt"
          echo "${ARCH}: ${digest}"
          printf -- "- \`linux/%s\` → \`%s\`\n" "${ARCH}" "${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Both registries hold the manifest
        run: |
          set -euo pipefail
          digest=$(cat "digest-${{ matrix.arch }}.txt")
          for image in "${DH_IMAGE}" "${GHCR_IMAGE}"; do
            if ! docker buildx imagetools inspect --raw "${image}@${digest}" > /dev/null; then
              echo "::error::${image} does not serve ${digest} after a successful push."
              exit 1
            fi
            echo "${image} serves ${digest}"
          done

      # Record what the pushed image actually installed, not only the digest of
      # its layers. Reading by the GHCR digest ties the package-version evidence
      # to the same immutable subject that the manifest job later tags.
      - name: Record installed package versions from the image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
          REVISION: ${{ needs.prepare.outputs.commit }}
          LOCKFILE: ${{ needs.prepare.outputs.lockfile }}
          TARBALL: ${{ needs.prepare.outputs.tarball }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(cat "digest-${ARCH}.txt")
          inventory="image-package-versions-${ARCH}.txt"
          error_log=$(mktemp)
          set +e
          docker run --rm --platform "${PLATFORM}" --entrypoint /bin/sh \
            "${GHCR_IMAGE}@${digest}" -c 'if [ -f /usr/share/looptroop/image-package-versions.txt ]; then cat /usr/share/looptroop/image-package-versions.txt; else exit 42; fi' \
            > "${inventory}" 2> "${error_log}"
          inventory_status=$?
          set -e
          if [ "${inventory_status}" -eq 42 ]; then
            rm -f "${inventory}"
            inventory="image-package-inventory-unavailable-${ARCH}.txt"
            printf 'legacy image: package-version inventory was not produced by this tag\n' > "${inventory}"
            echo 'Legacy image has no package-version inventory; retaining the repair evidence without applying the current strict check.'
          elif [ "${inventory_status}" -ne 0 ]; then
            cat "${error_log}" >&2
            rm -f "${error_log}"
            exit "${inventory_status}"
          elif ! test -s "${inventory}"; then
            echo '::error::The image package-version inventory is empty.'
            rm -f "${error_log}"
            exit 1
          elif ! grep -F -- "$(printf 'looptroop\t%s' "${VERSION}")" "${inventory}" >/dev/null; then
            echo "::error::The image does not record LoopTroop ${VERSION} as its installed package version."
            cat "${inventory}"
            rm -f "${error_log}"
            exit 1
          fi
          rm -f "${error_log}"
          {
            printf "### Container input and provenance (%s)\n\n" "${ARCH}"
            printf -- "- tarball: \`%s\`\n" "${TARBALL}"
            printf -- "- lockfile: \`%s\`\n" "${LOCKFILE}"
            printf -- "- platform: \`%s\`\n" "${PLATFORM}"
            printf -- "- revision: \`%s\`\n" "${REVISION}"
            printf -- "- digest: \`%s\`\n\n" "${digest}"
            echo '```'
            cat "${inventory}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-digest-${{ matrix.arch }}
          path: |
            digest-${{ matrix.arch }}.txt
            image-package-versions-${{ matrix.arch }}.txt
            image-package-inventory-unavailable-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The same tagging, with the same immutability pre-flight.
  # ---------------------------------------------------------------------------
  # This is the reason the logic is a script. A repair republishing a version
  # whose tags already exist must leave them exactly as they are unless it is
  # writing the identical bytes, and that rule cannot be allowed to differ by a
  # word from the one the release run applies.
  manifest:
    name: Tag the container image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.create.outputs.index_digest }}
      tags: ${{ steps.create.outputs.tags }}
      # What the published index actually lists, which is not what this run
      # built when an earlier publish was adopted. Verification compares
      # against these, so a repair is checked against the bytes it published.
      digest_amd64: ${{ steps.create.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.create.outputs.digest_arm64 }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: container-digest-*
          merge-multiple: true

      - name: Log in to Docker Hub and GHCR
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::The 'release' environment must carry DOCKERHUB_USERNAME (variable) and DOCKERHUB_TOKEN (secret)."
            exit 1
          fi
          printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io \
            --username "${DOCKERHUB_USERNAME}" --password-stdin
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Create the tags
        id: create
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          # The released commit, not the dispatch ref.
          REVISION: ${{ needs.prepare.outputs.commit }}
          FLOATING: ${{ needs.prepare.outputs.floating }}
        run: |
          set -euo pipefail
          node scripts/container-manifest.ts \
            --version "${VERSION}" \
            --dist-tag "${DIST_TAG}" \
            --revision "${REVISION}" \
            --floating-tags "${FLOATING}" \
            --image "${DH_IMAGE}" \
            --image "${GHCR_IMAGE}" \
            --digest "$(cat digest-amd64.txt)" \
            --digest "$(cat digest-arm64.txt)"

  # The per-architecture builds deliberately keep provenance off so the
  # deterministic index assembly remains compatible. Attest that finished
  # multi-architecture index, identified by the digest returned by `manifest`.
  attest:
    name: Attest finished container image
    needs: [prepare, manifest]
    if: always() && needs.manifest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      # `push-to-registry` makes the pinned actions/attest implementation read
      # Docker's credential store on this fresh runner before it can attach the
      # bundle to GHCR. Keep the token scoped to this one login step.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Log in to GHCR for attestation
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Attest the finished GHCR index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ needs.manifest.outputs.index_digest }}
          push-to-registry: true
          # This repair does not use Artifact Metadata storage records.
          create-storage-record: false

  # ---------------------------------------------------------------------------
  # Prove the repair worked before saying it did.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify container image (${{ matrix.arch }})
    needs: [prepare, manifest, attest]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.manifest.result == 'success'
      && needs.attest.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      # Both registries; see release.yml for why this is anonymous.
      - name: Both registries serve the release anonymously
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
        run: |
          set -euo pipefail
          for image in "${DH_IMAGE}" "${GHCR_IMAGE}"; do
            node scripts/container-check-anonymous.ts \
              --image "${image}" \
              --version "${VERSION}" \
              --index-digest "${INDEX_DIGEST}"
          done

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Pull the published tag and check it is this architecture
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          EXPECT_DIGEST: ${{ needs.manifest.outputs[format('digest_{0}', matrix.arch)] }}
        run: |
          set -euo pipefail
          node scripts/container-verify-pull.ts \
            --image "${GHCR_IMAGE}" \
            --version "${VERSION}" \
            --arch "${ARCH}" \
            --expect-digest "${EXPECT_DIGEST}"

      # The smoke script as it was at the released tag, against the bytes the
      # registry now serves.
      - name: Smoke the published image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/smoke-container.mjs \
            --image "${GHCR_IMAGE}:${VERSION}" \
            --version "${VERSION}"

  # ---------------------------------------------------------------------------
  # The notes the failed release never got to write.
  # ---------------------------------------------------------------------------
  # The splice replaces an existing block rather than appending a second one, so
  # this is safe whether or not the original run reached it.
  notes:
    name: Add the pull commands to the release notes
    needs: [prepare, manifest, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Splice the container block into the notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" --json body --jq '.body' > body.md
          node scripts/release-container-notes.ts \
            --version "${VERSION}" \
            --index-digest "${INDEX_DIGEST}" \
            --dh-image "${DH_IMAGE}" \
            --ghcr-image "${GHCR_IMAGE}" \
            --in body.md \
            --out body-next.md
          gh release edit "v${VERSION}" --notes-file body-next.md
          echo "Release notes for v${VERSION} now carry the pull commands."

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          INDEX_DIGEST: ${{ needs.manifest.outputs.index_digest }}
          TAGS: ${{ needs.manifest.outputs.tags }}
        run: |
          {
            echo "### Container image republished"
            echo
            echo "- version \`${VERSION}\`"
            echo "- index \`${INDEX_DIGEST}\`"
            echo "- tags \`${TAGS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Verify the repaired image against the registry.
  # ---------------------------------------------------------------------------
  #
  # `verify` above pulls from GHCR and smokes it, which proves the rebuild. This
  # additionally hands the version to the published install smoke, whose
  # container leg pulls the *Docker Hub* image and checks that `:latest` resolves
  # to it — the tag the README tells people to pull, and the one a repair is
  # most likely to have left pointing at the old image.
  #
  # Dispatched rather than waited on, for the same reasons as in `release.yml`:
  # a red smoke must not retroactively fail a repair that succeeded, and it has
  # to be re-runnable on its own. Without it a container repair is unverified
  # from a user's perspective until the next Monday.
  verify-repair:
    name: Verify the repaired image from Docker Hub
    needs: [prepare, verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Dispatch the published install smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run published-smoke.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "v${VERSION}" \
            -f version="${VERSION}" \
            -f tier=weekly \
            -f only=container \
            -f report_mode=issue
          echo "Dispatched the container leg of the published install smoke for v${VERSION}."
