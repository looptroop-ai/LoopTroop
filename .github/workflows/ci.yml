name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Silences npm's funding/update chatter so failures stand out in logs.
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  verify:
    name: Verify (ubuntu, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Build site
        run: npm run site:build

      # Guards the packaging premise: a native addon needs a compiler on the
      # user's machine and cannot go into a standalone binary.
      - name: Verify no native addons in the production package
        run: npm run verify:no-native-addons

      # package.json is the single source of truth for the version; a literal
      # copy elsewhere goes stale silently on the next release.
      - name: Verify version is single-sourced
        run: npm run verify:version

      # Guards against build steps mutating tracked files. Generated output
      # must land in ignored directories so releases are reproducible.
      - name: Verify working tree is clean after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build modified tracked files. Generated output must not be committed."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      # Report-only. Never auto-fix: remediation must be a reviewed change.
      - name: Audit production dependencies
        run: npm audit --omit=dev || true

  test-matrix:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Non-blocking while Windows and macOS remain unvalidated on real hardware.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test
