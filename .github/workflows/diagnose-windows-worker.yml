# TEMPORARY DIAGNOSTIC — delete before this branch merges.
#
# The Windows test lane fails intermittently with no failing test named: the
# summary reads `275 passed | 1 skipped (277)` while one file never reports at
# all, and the only error is `[vitest-pool]: Worker forks emitted error` /
# `Worker exited unexpectedly`. Local probes established what that signature
# does and does not mean:
#
#   process.exit() mid-test        -> reported as a named failing test
#   unhandled 'error' event        -> reported as a named failing test
#   throw after teardown           -> reported as an Uncaught Exception, with a
#                                     stack, and the file still counts
#   V8 heap exhaustion             -> prints `FATAL ERROR: ... out of memory`
#                                     and the stderr reaches the job log
#   SIGKILL mid-test               -> file never reports, only the pool error
#
# Only the last shape matches, and the failing job contains no fatal-error
# output whatsoever, so the child was terminated at the native level without
# getting to write a byte. That names neither the exception nor the faulting
# module, and neither is knowable from a passing Linux run — hence this job.
#
# It repeats the suite on a real Windows runner and, on any iteration that shows
# the signature, prints what only Windows can say: the crash exception code and
# faulting module from the Application event log, whatever minidump WER wrote,
# and Node's own diagnostic report if the death went through V8 rather than
# around it.
name: Diagnose Windows worker crash

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: How many times to run the suite per shard
        type: string
        default: '6'
      only:
        description: 'Optional vitest filter (e.g. loopbackCookieTheft). Empty runs the whole suite.'
        type: string
        default: ''

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  loop:
    name: Windows worker crash loop (shard ${{ matrix.shard }})
    runs-on: windows-latest
    # Sampling a rare crash is the whole point, so this needs to outlast the
    # 30 minutes a single test lane gets.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Two shards for twice the samples per dispatch. They are independent
        # runs of the same thing, not a split of the suite.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Pin npm to the declared version
        run: node scripts/pin-npm.mjs
        shell: bash

      - name: Install dependencies
        run: npm ci

      # A native crash writes nothing to stderr, so the evidence has to be
      # collected by the OS instead of by the process. WER only keeps local
      # dumps when it is told to, per executable, before the crash happens.
      - name: Ask Windows to keep node.exe crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value 'C:\node-dumps' -PropertyType ExpandString -Force | Out-Null
          # 1 = minidump. A full dump of a 4 GB heap per crash fills the disk,
          # and the exception code and faulting module are in the minidump.
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 20 -PropertyType DWord -Force | Out-Null
          New-Item -ItemType Directory -Path 'C:\node-dumps' -Force | Out-Null
          Write-Host 'WER local dumps enabled for node.exe -> C:\node-dumps'

      - name: Run the suite until a worker dies
        shell: pwsh
        env:
          # Read through the environment rather than interpolated into the
          # script body, so an input cannot become PowerShell.
          ITERATIONS: ${{ inputs.iterations }}
          ONLY: ${{ inputs.only }}
          # Inherited by every vitest child. If the death goes through V8 —
          # an OOM or an abort — this writes a report naming which.
          NODE_OPTIONS: --report-on-fatalerror --report-directory=C:\node-reports
        run: |
          New-Item -ItemType Directory -Path 'C:\node-reports' -Force | Out-Null
          $iterations = [int]$env:ITERATIONS
          $crashes = 0
          $failures = 0

          for ($i = 1; $i -le $iterations; $i++) {
            $log = Join-Path $env:RUNNER_TEMP "iteration-$i.log"
            $started = Get-Date
            Write-Host "::group::iteration $i of $iterations"
            if ([string]::IsNullOrWhiteSpace($env:ONLY)) {
              & npx vitest run 2>&1 | Tee-Object -FilePath $log
            } else {
              & npx vitest run $env:ONLY 2>&1 | Tee-Object -FilePath $log
            }
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'

            $died = [bool](Select-String -Path $log -Pattern 'Worker exited unexpectedly' -Quiet)
            if ($code -ne 0) { $failures++ }
            if ($died) { $crashes++ }
            Write-Host "iteration ${i}: exit=$code workerDied=$died"

            if ($died -or $code -ne 0) {
              Write-Host '::group::Windows crash records for this iteration'
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting', 'Application Hang') } |
                ForEach-Object { "$($_.TimeCreated) [$($_.ProviderName)]`n$($_.Message)`n" }
              Write-Host '::endgroup::'

              Write-Host '::group::Minidumps'
              Get-ChildItem 'C:\node-dumps' -ErrorAction SilentlyContinue |
                Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize | Out-String | Write-Host
              Write-Host '::endgroup::'

              Write-Host '::group::Node diagnostic reports'
              Get-ChildItem 'C:\node-reports' -Filter '*.json' -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                # The head carries event, trigger, signal and the JS stack; the
                # rest is a full heap and thread dump nobody can read in a log.
                Get-Content $_.FullName -TotalCount 60 | Write-Host
              }
              Write-Host '::endgroup::'
            }
          }

          $summary = "shard ${{ matrix.shard }}: $crashes worker deaths and $failures nonzero exits in $iterations runs"
          Write-Host "SUMMARY: $summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          # Always green: this job reports a rate, and a red X would read as a
          # broken diagnostic rather than a reproduced crash.
          exit 0
