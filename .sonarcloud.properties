# SonarQube Cloud automatic analysis settings.
#
# Copy-paste detection skips scripts/installer-core.mjs. Part of that file is a
# generated copy of server/lib/executablePath.ts, written there by
# scripts/sync-installers.mjs because the installer runs with no repository
# around it and cannot import the original. `npm run installers:check` fails
# when the copy drifts, so the duplication is the mechanism, not an accident,
# and counting it made every change to the resolver fail the new-code gate
# twice over.
#
# Only duplication is excluded. The file is still analysed for bugs, security
# issues and code smells like any other.
sonar.cpd.exclusions=scripts/installer-core.mjs
